services:
  - type: web
    name: virtu-server
    runtime: python
    region: singapore
    plan: free

    buildCommand: |
      npm ci
      npm run build
      pip install -r requirements.txt

    startCommand: gunicorn frontend_server:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120

    healthCheckPath: /api/suc_khoe

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: FLASK_ENV
        value: production
