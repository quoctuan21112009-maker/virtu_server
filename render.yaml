services:
  # Backend API
  - type: web
    name: virtu-backend
    runtime: python
    repo: https://github.com/yourusername/virtu-backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: virtu-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO

  # Frontend (nếu deploy cùng)
  - type: web
    name: virtu-frontend
    runtime: static
    repo: https://github.com/yourusername/virtu-frontend
    plan: free
    region: singapore
    buildCommand: npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://virtu-backend.onrender.com
      - key: REACT_APP_WEBSOCKET_URL
        value: wss://virtu-backend.onrender.com

databases:
  - name: virtu-db
    plan: free
    region: singapore
